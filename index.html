<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codepad</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div id="tabs" role="tablist"></div>
        <button id="add" title="Open file (Ctrl+O)" aria-label="Open file">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
        </button>
        <div class="spacer" data-tauri-drag-region></div>
        <div id="winctl">
          <button id="win-min" aria-label="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" fill="none"/></svg></button>
          <button id="win-max" aria-label="Maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" stroke="currentColor" fill="none"/></svg></button>
          <button id="win-close" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" fill="none"/></svg></button>
        </div>
      </header>

      <main id="stage">
        <div id="editor"></div>
        <div id="empty">
          <div class="empty-inner">
            <div class="logo">{ }</div>
            <p>Drop a file here or press <kbd>Ctrl</kbd> <kbd>O</kbd></p>
            <ul id="recent"></ul>
          </div>
        </div>
      </main>

      <footer id="status">
        <span id="st-pos"></span>
        <span id="st-lines"></span>
        <span class="grow"></span>
        <span id="st-lang"></span>
        <span id="st-enc">UTF-8</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
