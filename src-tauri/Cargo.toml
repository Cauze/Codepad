[package]
name = "codepad"
version = "0.3.1"
license = "MIT"
edition = "2021"

[lib]
name = "codepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# GitHub API + downloads for the in-app updater. native-tls = the OS (SChannel) stack, so no TLS library is bundled.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
