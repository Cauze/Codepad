name: Release

# Publish by pushing a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match the version in package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml.
# Windows and macOS are built side by side and published together as one release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const want = process.env.TAG.replace(/^v/, '');
          const found = {
            'package.json': JSON.parse(fs.readFileSync('package.json', 'utf8')).version,
            'src-tauri/tauri.conf.json': JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version,
            'src-tauri/Cargo.toml': /^version\s*=\s*"([^"]+)"/m.exec(fs.readFileSync('src-tauri/Cargo.toml', 'utf8'))?.[1],
          };
          let bad = false;
          for (const [file, v] of Object.entries(found)) {
            if (v !== want) { console.error(`::error file=${file}::version is ${v}, but the tag is ${process.env.TAG}`); bad = true; }
          }
          if (bad) process.exit(1);
          EOF

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Portable first: --no-bundle leaves the plain exe untouched, whereas bundling
      # stamps the installer type into it.
      - name: Build portable exe
        run: npx tauri build --no-bundle

      - name: Stage portable exe
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp src-tauri/target/release/codepad.exe "release/Codepad_${TAG#v}_x64-portable.exe"

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Stage installer
        shell: bash
        run: cp src-tauri/target/release/bundle/nsis/*-setup.exe release/

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # One universal app (Apple Silicon and Intel). The builds aren't notarized yet, so they are only
      # ad-hoc signed; the README says how to open them.
      - name: Build
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      # The .dmg is what people download. The .app.tar.gz is what the in-app updater downloads: it
      # unpacks it next to the running app and swaps the two (see src-tauri/src/update.rs).
      - name: Stage disk image and updater archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          out=src-tauri/target/universal-apple-darwin/release/bundle
          app="$out/macos/Codepad.app"
          lipo -info "$app/Contents/MacOS/codepad"
          codesign --verify --deep --strict "$app"
          mkdir release
          cp "$out"/dmg/*.dmg "release/Codepad_${TAG#v}_universal.dmg"
          COPYFILE_DISABLE=1 tar -czf "release/Codepad_${TAG#v}_universal.app.tar.gz" -C "$out/macos" Codepad.app
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes are built from the commit history

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Commit subjects since the previous tag (all of them for the first release); "Release x.y.z" commits are left out
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range="${prev:+$prev..}$TAG"
          {
            echo "## What's changed"
            echo
            git log "$range" --no-merges --reverse --pretty='- %s' --grep='^Release [0-9v]' --invert-grep
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/$prev...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l release
          flags="--notes-file release-notes.md"
          # v1.2.3-beta.1 and the like are marked as pre-releases
          [[ "$TAG" == *-* ]] && flags="$flags --prerelease"
          gh release create "$TAG" release/* --title "Codepad ${TAG#v}" $flags
